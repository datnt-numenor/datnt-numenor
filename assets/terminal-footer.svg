<svg width="1000" height="150" viewBox="0 0 1000 150" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="150">
    <stop stop-color="#020617"/><stop offset="1" stop-color="#031A18"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .quote{font:18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E2E8F0}
  .name{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5EEAD4}
  .muted{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#64748B}
</style>
<rect x="1" y="1" width="998" height="148" rx="20" fill="url(#bg)" stroke="#0F766E" stroke-opacity=".85"/>
<text x="38" y="48" class="name">&gt;</text>
<line x1="70" y1="30" x2="70" y2="116" stroke="#34D399" stroke-width="4" filter="url(#glow)"/>
<text x="98" y="58" class="quote">“Building AI systems that see, understand,</text>
<text x="98" y="86" class="quote">and create real value in the world.”</text>
<text x="98" y="116" class="name">— Dat Nguyen</text>
<text x="745" y="111" class="muted">AI × ENGINEERING × CURIOSITY</text>
</svg>