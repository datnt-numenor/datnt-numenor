<svg width="1000" height="430" viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#031A18"/>
    </linearGradient>
    <linearGradient id="neon" x1="540" y1="80" x2="930" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0F766E" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill:#94A3B8; }
    .neon { fill:#5EEAD4; }
    .line { stroke:#2DD4BF; stroke-width:1.4; opacity:.75; }
    .soft { stroke:#22D3EE; stroke-width:1; opacity:.32; }
    .pulse { fill:#5EEAD4; filter:url(#glow); animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .blink { animation:blink 1s steps(1,end) infinite; }
    .orbit { stroke:#2DD4BF; stroke-opacity:.42; fill:none; stroke-width:1.2; stroke-dasharray:7 8; animation:dash 12s linear infinite; }
    @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:.15} }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1.3)} }
    @keyframes dash { to { stroke-dashoffset:-120; } }
  </style>

  <rect x="1" y="1" width="998" height="428" rx="22" fill="url(#bg)" stroke="#0F766E" stroke-opacity=".75"/>
  <rect x="1" y="1" width="998" height="428" rx="22" fill="url(#grid)"/>

  <text x="40" y="46" class="mono muted" font-size="15">datnt-numenor / README.md</text>
  <circle cx="942" cy="38" r="5" class="pulse"/>

  <text x="44" y="110" class="mono neon" font-size="19">&gt;_ Hello, I'm</text>
  <text x="44" y="180" class="mono" fill="#F8FAFC" font-size="54" font-weight="700">Dat Nguyen</text>
  <rect x="365" y="135" width="7" height="56" rx="2" fill="#34D399" class="blink"/>
  <text x="44" y="225" class="mono neon" font-size="30">// AI Engineer</text>

  <text x="44" y="278" class="mono muted" font-size="17">Building intelligent AI systems that turn ideas into real-world impact.</text>
  <text x="44" y="309" class="mono muted" font-size="17">Focused on Computer Vision, Deep Learning, RAG, NLP, and scalable AI backends.</text>

  <g transform="translate(44 352)">
    <text x="0" y="0" class="mono neon" font-size="15">Research</text>
    <text x="88" y="0" class="mono muted" font-size="15">→</text>
    <text x="118" y="0" class="mono neon" font-size="15">Build</text>
    <text x="177" y="0" class="mono muted" font-size="15">→</text>
    <text x="207" y="0" class="mono neon" font-size="15">Evaluate</text>
    <text x="290" y="0" class="mono muted" font-size="15">→</text>
    <text x="320" y="0" class="mono neon" font-size="15">Iterate</text>
  </g>

  <!-- stylized neural profile -->
  <g transform="translate(610 60)">
    <ellipse cx="175" cy="150" rx="150" ry="118" class="orbit"/>
    <ellipse cx="175" cy="150" rx="120" ry="165" class="orbit" transform="rotate(26 175 150)"/>
    <ellipse cx="175" cy="150" rx="95" ry="178" class="orbit" transform="rotate(-36 175 150)"/>

    <path d="M200 53
             C164 46 126 61 104 89
             C88 109 82 133 90 151
             C98 168 113 180 114 194
             C115 208 104 220 108 233
             C115 256 145 269 169 269
             C186 269 198 263 207 253
             C218 241 221 226 222 209
             C223 190 236 180 245 164
             C257 142 258 116 247 93
             C237 72 221 58 200 53Z" fill="#071A1A" stroke="url(#neon)" stroke-width="2"/>

    <path d="M120 112 C150 79 197 71 224 94" class="soft"/>
    <path d="M107 145 C150 111 198 116 238 139" class="soft"/>
    <path d="M118 183 C151 158 188 159 220 178" class="soft"/>
    <path d="M139 218 C163 202 190 200 211 213" class="soft"/>

    <circle cx="132" cy="104" r="4" class="pulse"/>
    <circle cx="188" cy="84" r="3.5" class="pulse" style="animation-delay:-.6s"/>
    <circle cx="221" cy="126" r="4" class="pulse" style="animation-delay:-1.2s"/>
    <circle cx="161" cy="161" r="3.5" class="pulse" style="animation-delay:-1.7s"/>
    <circle cx="209" cy="205" r="4" class="pulse" style="animation-delay:-.9s"/>
    <circle cx="145" cy="230" r="3.5" class="pulse" style="animation-delay:-1.4s"/>

    <line x1="132" y1="104" x2="188" y2="84" class="line"/>
    <line x1="188" y1="84" x2="221" y2="126" class="line"/>
    <line x1="132" y1="104" x2="161" y2="161" class="line"/>
    <line x1="161" y1="161" x2="221" y2="126" class="line"/>
    <line x1="161" y1="161" x2="209" y2="205" class="line"/>
    <line x1="209" y1="205" x2="145" y2="230" class="line"/>

    <rect x="268" y="74" width="115" height="78" rx="10" fill="#031312" stroke="#14B8A6" stroke-opacity=".7"/>
    <text x="281" y="96" class="mono neon" font-size="12">while curious:</text>
    <text x="281" y="115" class="mono muted" font-size="12">  learn()</text>
    <text x="281" y="134" class="mono muted" font-size="12">  build()</text>

    <rect x="246" y="210" width="137" height="74" rx="10" fill="#031312" stroke="#14B8A6" stroke-opacity=".7"/>
    <text x="260" y="235" class="mono neon" font-size="20">AI</text>
    <text x="260" y="257" class="mono muted" font-size="12">RAG · CV · NLP</text>
  </g>
</svg>