<svg width="1000" height="430" viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="430">
    <stop stop-color="#0d1117"/>
    <stop offset="1" stop-color="#0f141b"/>
  </linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#56d364"/>
    <stop offset=".35" stop-color="#2ea043"/>
    <stop offset="1" stop-color="#0d1117"/>
  </radialGradient>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#30363d" stroke-opacity=".20" stroke-width="1"/>
  </pattern>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .title{fill:#f0f6fc;font-weight:700}
  .muted{fill:#8b949e}
  .accent{fill:#39d353}
  .edge{stroke:#30363d}
  .orbit{fill:none;stroke:#2ea043;stroke-width:1.5;stroke-opacity:.72;stroke-dasharray:8 8;animation:dash 14s linear infinite}
  .orbit2{fill:none;stroke:#56d364;stroke-width:1.1;stroke-opacity:.40}
  .particle{fill:#56d364;filter:url(#glow)}
  .panel{fill:#0d1117;stroke:#30363d}
  .icon{stroke:#39d353;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  @keyframes dash{to{stroke-dashoffset:-160}}
</style>
<rect x="1" y="1" width="998" height="428" rx="22" fill="url(#bg)" stroke="#30363d"/>
<rect x="1" y="1" width="998" height="428" rx="22" fill="url(#grid)"/>

<text x="40" y="46" class="mono muted" font-size="15">datnt-numenor / README.md</text>
<circle cx="950" cy="38" r="5" fill="#39d353"/>

<text x="46" y="112" class="mono accent" font-size="19">&gt;_ Hello, I'm</text>
<text x="46" y="182" class="mono title" font-size="55">Dat Nguyen</text>
<text x="46" y="229" class="mono accent" font-size="30">// AI Engineer</text>

<text x="46" y="282" class="mono muted" font-size="16">Building intelligent AI systems with a focus on real-world impact.</text>
<text x="46" y="311" class="mono muted" font-size="16">Computer Vision · Deep Learning · RAG · NLP · Scalable AI Backends</text>

<!-- Research -->
<g transform="translate(48 346)">
  <circle cx="9" cy="9" r="6" class="icon"/><line x1="14" y1="14" x2="20" y2="20" class="icon"/>
  <text x="29" y="15" class="mono accent" font-size="14">Research</text>
  <text x="112" y="15" class="mono muted" font-size="14">→</text>
</g>
<!-- Build -->
<g transform="translate(181 346)">
  <path d="M4 6L10 2L16 6L10 10L4 6Z M4 6V14L10 18L16 14V6 M10 10V18" class="icon"/>
  <text x="27" y="15" class="mono accent" font-size="14">Build</text>
  <text x="79" y="15" class="mono muted" font-size="14">→</text>
</g>
<!-- Evaluate -->
<g transform="translate(282 346)">
  <path d="M3 18V9M9 18V4M15 18V12M1 18H19" class="icon"/>
  <text x="28" y="15" class="mono accent" font-size="14">Evaluate</text>
  <text x="101" y="15" class="mono muted" font-size="14">→</text>
</g>
<!-- Iterate -->
<g transform="translate(405 346)">
  <path d="M4 8A7 7 0 0 1 16 5L18 7M16 14A7 7 0 0 1 4 17L2 15M18 7H13M2 15H7" class="icon"/>
  <text x="28" y="15" class="mono accent" font-size="14">Iterate</text>
</g>

<!-- orbital nucleus / galaxy -->
<g transform="translate(610 48)">
  <ellipse cx="175" cy="155" rx="145" ry="88" class="orbit"/>
  <ellipse cx="175" cy="155" rx="145" ry="88" class="orbit" transform="rotate(58 175 155)"/>
  <ellipse cx="175" cy="155" rx="145" ry="88" class="orbit" transform="rotate(-58 175 155)"/>
  <ellipse cx="175" cy="155" rx="112" ry="68" class="orbit2" transform="rotate(18 175 155)"/>

  <circle cx="175" cy="155" r="46" fill="url(#core)" stroke="#2ea043" stroke-width="2"/>
  <circle cx="175" cy="155" r="8" fill="#56d364" filter="url(#glow)"/>

  <circle cx="61" cy="132" r="6" class="particle">
    <animateTransform attributeName="transform" type="rotate" from="0 175 155" to="360 175 155" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="257" cy="96" r="5" class="particle">
    <animateTransform attributeName="transform" type="rotate" from="0 175 155" to="-360 175 155" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="246" cy="233" r="6" class="particle">
    <animateTransform attributeName="transform" type="rotate" from="0 175 155" to="360 175 155" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".7">
    <circle cx="116" cy="112" r="3" fill="#56d364"/>
    <circle cx="202" cy="106" r="3" fill="#56d364"/>
    <circle cx="216" cy="185" r="3" fill="#56d364"/>
    <circle cx="134" cy="202" r="3" fill="#56d364"/>
    <line x1="116" y1="112" x2="175" y2="155" stroke="#2ea043"/>
    <line x1="202" y1="106" x2="175" y2="155" stroke="#2ea043"/>
    <line x1="216" y1="185" x2="175" y2="155" stroke="#2ea043"/>
    <line x1="134" y1="202" x2="175" y2="155" stroke="#2ea043"/>
  </g>

  <rect x="286" y="89" width="128" height="82" rx="11" class="panel"/>
  <text x="300" y="116" class="mono accent" font-size="13">while curious:</text>
  <text x="300" y="141" class="mono muted" font-size="12">learn()</text>
  <text x="300" y="161" class="mono muted" font-size="12">build()</text>

  <rect x="268" y="224" width="146" height="72" rx="11" class="panel"/>
  <text x="284" y="250" class="mono accent" font-size="17">Core Focus</text>
  <text x="284" y="275" class="mono muted" font-size="12">RAG · CV · NLP</text>
</g>
</svg>